name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:mac

      # ditto rather than zip: it keeps the bundle's symlinks and metadata, and an .app that lost
      # those is an .app that will not open.
      - name: Pack the application
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/mac-arm64/Clawdeen.app" "dist/Clawdeen-${version}-arm64.zip"

      # The notes live in a file of their own rather than inline. They tell whoever downloaded the
      # build how to open it, so they have to be edited when that answer changes, and an answer
      # buried in a shell string inside a workflow is one nobody reads: the inline copy went on
      # recommending right click and Open for a whole release after the README had stopped.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Clawdeen ${version}" \
            --notes-file .github/release-notes.md \
            "dist/Clawdeen-${version}-arm64.zip"
