appId: cz.itsemilyjpg.clawdeen
productName: Clawdeen
# Said here rather than left to the default, which builds it out of `author` in package.json and so
# changes wherever that does. This is what the About panel shows.
copyright: Copyright © 2026 ItsEmilyJpg
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
afterPack: tools/build/adhoc-sign.js
asarUnpack:
  - resources/**
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dir
  # No developer account, so no real signature and no notarisation. The bundle is signed ad-hoc in
  # afterPack instead, because Apple silicon refuses one whose signature does not check out and
  # tells whoever downloaded it that the application is damaged.
  identity: null
  notarize: false
  extendInfo:
    # The window is a board, not a document: without this it also wants a dock icon of its own.
    - LSUIElement: false
npmRebuild: false
